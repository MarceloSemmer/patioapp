<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#cbd5e1" stroke-width="4"/>
  <text x="800" y="60" font-family="Arial, sans-serif" font-size="28" fill="#1e293b" text-anchor="middle">Pátio Tijuco — Planta do Térreo (demonstração)</text>

  <!-- Alameda principal -->
  <rect x="60" y="120" width="1480" height="120" fill="#e2e8f0"/>
  <text x="800" y="185" font-family="Arial" font-size="16" fill="#64748b" text-anchor="middle">Alameda Principal</text>

  <!-- Lojas -->
  <rect x="80" y="140" width="190" height="200" fill="#dbeafe" stroke="#94a3b8"/>
  <rect x="300" y="140" width="190" height="200" fill="#dbeafe" stroke="#94a3b8"/>
  <rect x="520" y="140" width="190" height="200" fill="#dbeafe" stroke="#94a3b8"/>
  <rect x="740" y="140" width="230" height="200" fill="#dbeafe" stroke="#94a3b8"/>
  <rect x="1000" y="140" width="190" height="200" fill="#dbeafe" stroke="#94a3b8"/>

  <!-- Quiosques -->
  <rect x="80" y="620" width="130" height="150" fill="#fef3c7" stroke="#94a3b8"/>
  <rect x="240" y="620" width="130" height="150" fill="#fef3c7" stroke="#94a3b8"/>

  <!-- Praça de alimentação -->
  <rect x="620" y="880" width="160" height="90" fill="#fee2e2" stroke="#94a3b8"/>
  <rect x="800" y="880" width="160" height="90" fill="#fee2e2" stroke="#94a3b8"/>
  <rect x="980" y="880" width="160" height="90" fill="#fee2e2" stroke="#94a3b8"/>

  <text x="800" y="500" font-family="Arial" font-size="14" fill="#94a3b8" text-anchor="middle">
    Imagem ilustrativa gerada para o ambiente de demonstração — não representa a planta real do imóvel.
  </text>
</svg>
